<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups - Anna Boynton, LCSW</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'sage': '#44643A',
                        'sage-light': '#7A8B6B',
                        'warm-bg': '#FAF7F2',
                        'warm-white': '#f8f8f0'
                    },
                    fontFamily: {
                        'serif': ['Georgia', 'serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-warm-bg text-gray-800 font-sans">
    <!-- Navigation -->
    <nav class="bg-warm-white shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <a href="index.html" class="flex items-center hover:opacity-90 transition-opacity">
                    <img src="logo2.jpg" alt="Anna Boynton, LCSW" class="h-20 w-auto">
                    <div class="ml-4">
                        <h1 class="text-2xl font-medium text-sage leading-tight">
                            <span class="block">Anna Boynton</span>
                            <span class="block">LCSW</span>
                        </h1>
                    </div>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-lg text-gray-700 hover:text-sage transition-colors">Home</a>
                    <a href="services.html" class="text-lg text-gray-700 hover:text-sage transition-colors">Services</a>
                    <a href="groups.html" class="text-lg text-sage font-medium border-b-2 border-sage pb-1">Groups</a>
                    <a href="contact.html" class="text-lg text-gray-700 hover:text-sage transition-colors">About & Contact</a>
                </div>
                <div class="md:hidden">
                    <button class="text-sage" onclick="toggleMenu()">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="mobile-menu" class="md:hidden hidden pb-4">
                <a href="index.html" class="block py-2 text-gray-700 hover:text-sage">Home</a>
                <a href="services.html" class="block py-2 text-gray-700 hover:text-sage">Services</a>
                <a href="groups.html" class="block py-2 text-sage font-medium">Groups</a>
                <a href="contact.html" class="block py-2 text-gray-700 hover:text-sage">About & Contact</a>
            </div>
        </div>
    </nav>

    <!-- Group Flyer -->
    <section class="py-12 px-4">
        <div class="max-w-2xl mx-auto">
            <img src="mindfulness.jpeg" alt="Mindfulness for Chronic Pain Group" class="w-full rounded-lg shadow-lg">
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-sage text-white py-8 px-4 mt-16">
        <div class="max-w-4xl mx-auto text-center">
            <h4 class="text-xl font-medium mb-2">Anna Boynton, LCSW</h4>
            <p class="text-sage-light">Anna Boynton, LCSW</p>
            <div class="mt-4 space-x-6">
                <a href="index.html" class="text-sage-light hover:text-white transition-colors">Home</a>
                <a href="services.html" class="text-sage-light hover:text-white transition-colors">Services</a>
                <a href="groups.html" class="text-sage-light hover:text-white transition-colors">Groups</a>
                <a href="contact.html" class="text-sage-light hover:text-white transition-colors">About & Contact</a>
            </div>
        </div>
    </footer>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }
    </script>
</body>
</html>
